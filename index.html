<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 雷达</title>
<script>
(function(){try{var t=localStorage.getItem('radar-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
<style>
:root{
  --bg:#f7f5f0;--surface:#fffefb;--surface-2:#f1eee7;--text:#1f1f1f;--text-2:#4a4a4a;--text-3:#5c5c5c;
  --line:#e9e5dc;--line-2:#d6d0c4;--accent:#36594f;--accent-bg:#e4eeea;--hot:#8f4420;--hot-bg:#f6e7dc;
  --shadow:0 1px 2px rgba(40,35,25,.04),0 6px 20px -12px rgba(40,35,25,.18);
}
[data-theme=dark]{
  --bg:#1b1b19;--surface:#232321;--surface-2:#2c2c29;--text:#efece6;--text-2:#cdc8be;--text-3:#b0aa9f;
  --line:#33322e;--line-2:#423f39;--accent:#9fcbbd;--accent-bg:#29352f;--hot:#eeb08a;--hot-bg:#3a2d24;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:40px 28px 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:36px}
.brand{font-size:15px;font-weight:600;letter-spacing:.2px;color:var(--text-2)}
.brand b{color:var(--text);font-weight:650}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:7px 18px;border-radius:8px;font-size:14.5px;color:var(--text-2);transition:all .2s}
.seg button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:560}
.theme{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--line)}
.theme:hover{color:var(--text);border-color:var(--line-2)}
.theme svg{width:17px;height:17px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:999px;font-size:13.5px;color:var(--text-2);border:1px solid transparent;transition:all .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--surface);border-color:var(--line-2);color:var(--text);font-weight:560}
.chip .ct{color:var(--text-3);font-size:12px;margin-left:4px;font-weight:400}
.sort{font-size:13px;color:var(--text-3)}
.sort button{color:var(--text-3);padding:2px 6px;border-radius:6px}
.sort button[aria-pressed=true]{color:var(--text);background:var(--surface-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.owner{font-size:12.5px;color:var(--text-3);line-height:1.3}
.name{font-size:16px;font-weight:620;line-height:1.35;word-break:break-word;display:inline-flex;align-items:center;gap:6px}
.name:hover{color:var(--accent)}
.name .arr{opacity:0;transition:opacity .15s;font-size:13px;color:var(--text-3)}
.card:hover .name .arr{opacity:1}
.star{font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.line{margin-top:10px;font-size:14.5px;color:var(--text-2);line-height:1.6}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.tag.hot{background:var(--hot-bg);color:var(--hot)}
.tag.new{background:var(--accent-bg);color:var(--accent)}
.more{white-space:nowrap;font-size:12.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:6px}
.more:hover{color:var(--text)}
.more svg{width:12px;height:12px;transition:transform .2s}
.card.open .more svg{transform:rotate(180deg)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.detail .in{padding-top:14px;margin-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--text-2);display:grid;gap:8px}
.detail b{color:var(--text);font-weight:560;margin-right:6px}
.thumb{display:block;position:relative;margin:-20px -20px 16px;border-radius:13px 13px 0 0;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2);border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.card:hover .thumb img{transform:scale(1.025)}
.dg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;background:radial-gradient(110% 90% at 15% 0%,var(--accent-bg),transparent 65%),var(--surface-2)}
.dg .nd{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dg .lb{font-size:10.5px;letter-spacing:.8px;color:var(--text-3);font-weight:600}
.dg .bx{width:100%;min-height:58px;display:grid;place-items:center;text-align:center;font-size:13px;line-height:1.35;padding:8px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);color:var(--text);font-weight:560}
.dg .nd.mid .bx{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.dg svg{flex:none;width:14px;height:14px;color:var(--text-3);margin-top:16px}
.gh{white-space:nowrap;font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;padding:2px 4px;border-radius:6px}
.gh:hover{color:var(--accent)}
.gh svg{width:13px;height:13px}
.f-r{display:flex;align-items:center;gap:6px;flex:none}
.foot .tags{min-width:0}
.when{margin-top:10px;font-size:12.5px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.when b{font-weight:560;color:var(--text-2);margin-right:4px}
/* trends */
.pat{margin-bottom:30px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 22px}
.prow{display:grid;grid-template-columns:28px 190px 1fr;gap:4px 14px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pn{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:600}
.pt-t{font-size:14.5px;font-weight:620;color:var(--text)}
.pt-d{font-size:13.5px;color:var(--text-2);line-height:1.55}
.pt-c{grid-column:3;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pc{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);background:var(--bg);transition:all .15s}
.pc:hover{color:var(--accent);border-color:var(--accent)}
.card.flash{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.cn{margin-top:36px}
.cn summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);padding:5px 13px;border:1px solid var(--line-2);border-radius:999px;margin-bottom:18px}
.cn summary::-webkit-details-marker{display:none}
.cn summary::after{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:4px;transition:transform .2s}
.cn[open] summary::after{transform:rotate(225deg) translate(-1px,-1px)}
.cn .ct{color:var(--text-3);font-size:12px}
@media(max-width:700px){.prow{grid-template-columns:24px 1fr}.pt-d,.pt-c{grid-column:2}}
.media{position:relative;margin:-20px -20px 16px;border-radius:13px 13px 0 0;overflow:hidden;aspect-ratio:16/9;background:var(--surface-2);cursor:pointer}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .ph{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,var(--accent-bg),transparent 60%),linear-gradient(135deg,var(--surface-2),var(--line))}
.media .play{position:absolute;inset:0;display:grid;place-items:center}
.media .play span{width:52px;height:52px;border-radius:50%;background:rgba(20,20,18,.55);backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .2s}
.media:hover .play span{transform:scale(1.07)}
.media .play svg{width:20px;height:20px;fill:#fff;margin-left:3px}
.media .src-l{position:absolute;left:10px;bottom:9px;font-size:11.5px;color:#fff;background:rgba(20,20,18,.5);padding:2px 8px;border-radius:6px}
.media.tall.playing{aspect-ratio:9/16;max-height:560px}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.plat{font-size:12.5px;color:var(--text-3);margin-bottom:4px}
.t-name{font-size:16px;font-weight:620;line-height:1.4;display:flex;align-items:center;gap:8px}
.tbd{font-size:11px;font-weight:500;color:var(--hot);border:1px solid var(--hot-bg);background:var(--hot-bg);padding:0 6px;border-radius:5px;cursor:help;white-space:nowrap;position:relative}
.tbd:hover::after,.tbd:focus::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);width:220px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;z-index:5;white-space:normal;font-weight:400}
.t-row{margin-top:8px;font-size:14.5px;color:var(--text-2);line-height:1.6}
.t-row i{font-style:normal;color:var(--text-3);font-size:12.5px;margin-right:6px}
.links{display:flex;gap:14px;font-size:12.5px;color:var(--text-3)}
.links a:hover{color:var(--accent)}
.hidden{display:none!important}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);text-align:center}
@media(max-width:600px){.wrap{padding:24px 16px 56px}.top{flex-wrap:wrap}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">

  <footer>数据更新于 2026-10-21</footer>
</div>

];
$('#tr-pat').innerHTML=PATS.map((p,i)=>`<div class="prow"><span class="pn">0${i+1}</span><span class="pt-t">${p[0]}</span><span class="pt-d">${p[1]}</span><div class="pt-c">${p[2].map(c=>`<a class="pc" href="#t-${c[0]}" data-k="${c[0]}">${c[1]}</a>`).join('')}</div></div>`).join('');
$('#tr-pat').onclick=e=>{const a=e.target.closest('.pc');if(!a)return;e.preventDefault();
  if(trCat!=='全部'){trCat='全部';$('#tr-chips').querySelectorAll('.chip').forEach(z=>z.setAttribute('aria-pressed',z.dataset.c==='全部'));renderTrends();}
  const c=document.getElementById('t-'+a.dataset.k);if(!c)return;const d=c.closest('details');if(d)d.open=true;
  c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1600);};
function chips(el,cats,counts,get,set,render){
  el.innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===get()}" data-c="${c}">${c}${counts?`<span class="ct">${counts(c)}</span>`:''}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;set(b.dataset.c);el.querySelectorAll('.chip').forEach(z=>z.setAttribute('aria-pressed',z===b));render();};
}
const SKC=['全部','工程/Agent','设计','美学','动效·视频','玩法','效率'];
chips($('#sk-chips'),SKC,c=>c==='全部'?SKILLS.length:SKILLS.filter(s=>s.c===c).length,()=>skCat,v=>skCat=v,renderSkills);
const TRC=['全部','有视频','TikTok','Instagram','YouTube','X','Facebook'];
chips($('#tr-chips'),TRC,null,()=>trCat,v=>trCat=v,renderTrends);
$('#sk-sort').onclick=e=>{const b=e.target.closest('button');if(!b)return;skSort=b.dataset.s;$('#sk-sort').querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',z===b));renderSkills();};
document.addEventListener('click',e=>{
  const m=e.target.closest('.more');
  if(m){const c=m.closest('.card');const o=c.classList.toggle('open');m.setAttribute('aria-expanded',o);return;}
  const md=e.target.closest('.media[data-t]');
  if(md&&!md.classList.contains('playing')){
    if(md.dataset.t==='yt'&&location.protocol==='file:'){window.open('https://www.youtube.com/watch?v='+md.dataset.id,'_blank','noopener');return;}
    md.classList.add('playing');
    md.innerHTML=`<iframe src="${embedURL(md.dataset.t,md.dataset.id)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.media[data-t]')){e.preventDefault();e.target.click();}});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(z=>z.setAttribute('aria-selected',z===b));
  $('#p-skills').classList.toggle('hidden',b.dataset.tab!=='skills');
  $('#p-trends').classList.toggle('hidden',b.dataset.tab!=='trends');
  try{history.replaceState(null,'','#'+b.dataset.tab)}catch(e){}
});
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function syncTheme(){$('#theme').innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON;}
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('radar-theme',t)}catch(e){}syncTheme();};
syncTheme();renderSkills();renderTrends();
if(location.hash==='#trends')document.querySelector('.seg [data-tab=trends]').click();
</script>
